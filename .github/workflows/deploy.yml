name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Prevent concurrent deployments to same environment
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment }}
      COMMIT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Backend Image
        working-directory: backend
        run: |
          docker build -t "status-stock-backend:${COMMIT_SHA}" .
          docker tag "status-stock-backend:${COMMIT_SHA}" status-stock-backend:latest

      - name: Build Bot Image
        working-directory: bot
        run: |
          docker build -t "status-stock-bot:${COMMIT_SHA}" .
          docker tag "status-stock-bot:${COMMIT_SHA}" status-stock-bot:latest

      - name: Build WebApp
        working-directory: webapp
        run: |
          npm ci
          npm run build

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${DEPLOY_ENV}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by:** ${ACTOR}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Docker Images Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- status-stock-backend:${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- status-stock-bot:${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Info
        run: |
          echo "==================================================="
          echo "DEPLOYMENT TO ${DEPLOY_ENV}"
          echo "==================================================="
          echo ""
          echo "TODO: Add actual deployment commands here"
          echo ""
          echo "Options:"
          echo "  1. Push to Docker registry"
          echo "  2. SSH to server and docker-compose up"
          echo "  3. kubectl apply for Kubernetes"
          echo "  4. Cloud provider CLI deployment"
          echo ""
          echo "Images ready:"
          echo "  - status-stock-backend:${COMMIT_SHA}"
          echo "  - status-stock-bot:${COMMIT_SHA}"
          echo "  - webapp/dist/ (static files)"
