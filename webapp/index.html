<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Status Stock</title>
    <!-- Critical CSS inline for instant FCP -->
    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#181818;color:#fff;font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100%;display:flex;flex-direction:column}
      /* Loading skeleton */
      .app-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#181818;z-index:9999}
      .app-loader-spinner{width:48px;height:48px;border:4px solid rgba(255,107,0,.2);border-top-color:#FF6B00;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <!-- Preconnect for faster external resources -->
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts with display=swap for non-blocking load -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
    <!-- Telegram SDK (defer to not block render) -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <!-- DEBUG: Early URL logging -->
    <script>
      console.log('[EARLY] URL:', window.location.href);
      console.log('[EARLY] Origin:', window.location.origin);
    </script>
    <!-- Platform Detection (BEFORE React hydration) -->
    <script>
      (function(){
        var p = (window.Telegram && Telegram.WebApp && Telegram.WebApp.platform) || 'unknown';
        document.documentElement.setAttribute('data-platform', p);
        if (p === 'android') document.documentElement.classList.add('platform-android');
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Inline loading state for instant FCP -->
      <div class="app-loader"><div class="app-loader-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
