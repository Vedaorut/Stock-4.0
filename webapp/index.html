<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Telegram Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Platform Detection (BEFORE React hydration) -->
    <script>
      (function(){
        var p = (window.Telegram && Telegram.WebApp && Telegram.WebApp.platform) || 'unknown';
        document.documentElement.setAttribute('data-platform', p);

        // Backward compatibility (старый код использует class)
        if (p === 'android') {
          document.documentElement.classList.add('platform-android');
        }
      })();
    </script>
  </head>
  <body style="background:#181818;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
